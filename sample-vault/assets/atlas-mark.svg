<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Atlas mark</title>
  <desc id="desc">An original abstract landscape of three layered hills under a small circle.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2430"/>
      <stop offset="1" stop-color="#2d3444"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c7bd9"/>
      <stop offset="1" stop-color="#4652a3"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4bb3a5"/>
      <stop offset="1" stop-color="#2d7d76"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0a458"/>
      <stop offset="1" stop-color="#b97032"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="24" fill="url(#sky)"/>
  <circle cx="500" cy="96" r="42" fill="#f5e6c8" opacity="0.9"/>
  <path d="M0 260 L140 150 L250 238 L360 138 L520 260 L640 200 L640 360 L0 360 Z" fill="url(#back)" opacity="0.75"/>
  <path d="M0 300 L120 220 L230 286 L340 206 L470 300 L580 240 L640 276 L640 360 L0 360 Z" fill="url(#mid)" opacity="0.85"/>
  <path d="M0 330 L150 270 L280 326 L410 262 L540 330 L640 300 L640 360 L0 360 Z" fill="url(#front)"/>
  <g fill="#f8f4ea" opacity="0.8">
    <circle cx="92" cy="82" r="3"/>
    <circle cx="160" cy="120" r="2"/>
    <circle cx="240" cy="70" r="2.5"/>
    <circle cx="330" cy="110" r="2"/>
    <circle cx="410" cy="64" r="2.5"/>
  </g>
</svg>
